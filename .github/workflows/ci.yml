name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  LOCATION: ${{ vars.AZURE_LOCATION || 'westeurope' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t vantage:ci .

      - name: Start container
        run: docker run -d --name vtest -p 8181:8080 -e AUTO_SEED=1 vantage:ci

      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8181/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -sf http://127.0.0.1:8181/api/health | grep -q vantage

      - name: API smoke inside container
        run: docker exec vtest node smoke.js

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Pull stock for upload test
        run: docker cp vtest:/app/stock-videos ./stock-videos

      - name: End-to-end suite against container
        env:
          VB: http://127.0.0.1:8181
          STOCK_DIR: ${{ github.workspace }}/stock-videos
          AGG_DATA: ${{ github.workspace }}/.agg-data
        run: node tests/vantage-agg.cjs

      - name: Archive suite artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            *.png
            .agg-data
          if-no-files-found: ignore

  deploy:
    if: github.ref == 'refs/heads/main' && vars.VM_DEPLOY == '1'
    needs: test
    runs-on: ubuntu-latest
    env:
      VM_HOST: ${{ secrets.VM_HOST }}
      VM_KEY: ${{ secrets.VM_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Azure VM
        if: env.VM_HOST != '' && env.VM_KEY != ''
        run: |
          mkdir -p /tmp/vdep && tar -czf /tmp/vantage.tgz --exclude=.git --exclude=data --exclude=node_modules --exclude=stock-videos --exclude=.agg-data -C "${{ github.workspace }}" .
          printf '%s' "$VM_KEY" > /tmp/vm_key.pem && chmod 600 /tmp/vm_key.pem
          scp -i /tmp/vm_key.pem -o StrictHostKeyChecking=accept-new /tmp/vantage.tgz azureuser@$VM_HOST:/tmp/vantage.tgz
          ssh -i /tmp/vm_key.pem -o StrictHostKeyChecking=accept-new azureuser@$VM_HOST \
            "sudo tar -xzf /tmp/vantage.tgz -C /home/azureuser/vantage && sudo chown -R azureuser:azureuser /home/azureuser/vantage && sudo cp /home/azureuser/vantage/deploy/vantage.service /etc/systemd/system/vantage.service && sudo systemctl daemon-reload && sudo systemctl restart vantage && sleep 4 && sudo systemctl is-active vantage && curl -sf http://127.0.0.1/api/health"
          curl -sf "http://$VM_HOST/api/health"
          echo "LIVE AT http://$VM_HOST"
